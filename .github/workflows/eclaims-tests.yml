name: eClaims Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/Models/Philhealth*.php'
      - 'app/Models/Claim*.php'
      - 'app/Models/Cf5*.php'
      - 'app/Services/Philhealth/**'
      - 'app/Livewire/Philhealth/**'
      - 'resources/views/livewire/philhealth/**'
      - 'resources/views/pages/philhealth/**'
      - 'routes/web.php'
      - 'routes/console.php'
      - 'database/migrations/*philhealth*'
      - 'database/migrations/*claim*'
      - 'config/philhealth.php'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/eclaims-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/Models/Philhealth*.php'
      - 'app/Models/Claim*.php'
      - 'app/Services/Philhealth/**'
      - 'app/Livewire/Philhealth/**'
      - 'tests/**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [8.2, 8.3]

    name: PHP ${{ matrix.php }} — Unit Tests

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, dom, xml, zip
          ini-values: error_reporting=E_ALL
          coverage: none

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Run PhilHealth unit tests
        run: php artisan test tests/Unit/Philhealth/ --no-coverage
